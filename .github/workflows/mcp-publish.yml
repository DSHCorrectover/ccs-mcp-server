name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.json'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mp.tgz
          tar xzf mp.tgz
          chmod +x mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Authenticate via GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
